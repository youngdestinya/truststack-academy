    <text x="210" y="215" fill="#83e4ef" font-size="12" letter-spacing="4">DATA PROTECTION</text>
    <text x="210" y="288" fill="#ffffff" font-size="69" letter-spacing="3">CDPO</text>
    <text x="210" y="312" fill="#d9c999" font-size="13" letter-spacing="2.4">30-DAY LEARNING PATH</text>
