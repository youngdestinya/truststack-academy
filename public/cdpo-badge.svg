  <g fill="none" stroke="#e8fbfd" stroke-linecap="round" stroke-linejoin="round">
    <path d="M189 88h37v42h-37z" stroke-width="3"/><path d="M196 97h19M196 104h10" stroke-width="2" opacity=".8"/>
    <path d="M211 107v-6a7 7 0 0 1 14 0v6" stroke-width="3"/>
    <rect x="207" y="107" width="22" height="19" rx="3" fill="#d7b352" stroke="#d7b352" stroke-width="2"/>
